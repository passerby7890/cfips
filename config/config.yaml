# ==============================================================================
# CF-Global-QuadNet-Feed 系統配置檔 (v2.0 終極修訂版)
# ==============================================================================

# 源站回源驗證基準參數
origin:
  sni: "node1.snowcat77.com"              # TLS 握手 SNI 標頭（需開啟 Cloudflare 代理）
  host: "node1.snowcat77.com"             # HTTP Host 標頭
  port: 2053                              # 驗證端口
  ws_path: "/ws"                          # WebSocket 升級路徑
  expected_status: 101                    # 期望握手成功碼 (HTTP 101 Switching Protocols)
  timeout_sec: 2.5                        # 握手超時上限（秒）
  handshake_rounds: 2                     # 測試次數以計算平均握手延遲

# 系統調優與快篩參數
tuning:
  precheck_timeout_sec: 0.6               # 端口快篩極短超時 (秒)
  concurrency_limit: 40                   # 併發驗證上限
  speedtest_duration_limit: 2.5           # 測速切片截斷時間 (秒)
  history_decay_ratio: 0.7                # 歷史分權重 70%，當次實測分 30%
  max_ips_per_subnet: 3                   # 同 /24 網段最多收錄 3 個
  target_output_count: 50                 # 每個分類目標輸出前 50 名

# 晚高峰四層階梯降級門檻
thresholds:
  tier_1: { speed_mbps: 30.0, loss_percent: 5.0, name: "HEALTHY" }
  tier_2: { speed_mbps: 15.0, loss_percent: 8.0, name: "DEGRADED_L1" }
  tier_3: { speed_mbps: 5.0, loss_percent: 12.0, name: "DEGRADED_L2" }
  tier_4: { speed_mbps: 0.0, loss_percent: 100.0, name: "EMERGENCY" }

# 四網機房偏好清單 (colo)
preferred_colos:
  ct: ["SJC", "LAX", "SEA"]
  cu: ["SJC", "LAX", "NRT", "FRA"]
  cm: ["HKG", "SIN", "NRT", "SJC"]
  edu: ["SJC", "LAX", "HKG"]

# 運營商別名與中文化配置 (相容顯示)
carrier_preferences:
  ct:
    name: "中國電信"
    preferred_colos: ["SJC", "LAX", "SEA"]
    bonus_ms: 30.0
  cu:
    name: "中國聯通"
    preferred_colos: ["SJC", "LAX", "NRT", "FRA"]
    bonus_ms: 30.0
  cm:
    name: "中國移動"
    preferred_colos: ["HKG", "SIN", "NRT", "SJC"]
    bonus_ms: 30.0
  edu:
    name: "教育網"
    preferred_colos: ["SJC", "LAX", "HKG"]
    bonus_ms: 30.0

# 階段一：情報收集策略
collector:
  # 策略 A: 基於北上廣四網錨點的 ECS (EDNS Client Subnet) DoH 偽裝解析
  ecs_doh:
    enabled: true
    doh_url: "https://dns.google/resolve"
    anchors_file: "data/cn_anchors.json"
    domains:
      - "www.visa.com.sg"
      - "www.visa.hk"
      - "time.is"
      - "cf.090227.xyz"
      - "cf.877774.xyz"
      - "freeyx.cloudflare88.eu.org"

  # 策略 B: 大陸境內公開三網實測榜單抓取
  mainland_sources:
    enabled: true
    timeout_sec: 15
    sources:
      - name: "wetest"
        type: "html_table"
        url: "https://www.wetest.vip/page/cloudflare/address_v4.html"
      - name: "hostmonit"
        type: "hostmonit"
        url: "https://api.hostmonit.com/get_optimization_ip"
        key: "iDetkOys"
      - name: "uouin"
        type: "html_table"
        url: "https://api.uouin.com/cloudflare.html"
      - name: "ip_164746"
        type: "text"
        url: "https://ip.164746.xyz/ipTop10.html"

  # 策略 C: 分國家地區公開優選/反代來源
  country_sources:
    enabled: true
    timeout_sec: 15
    sources:
      - name: "tiancheng_hk"
        type: "text"
        country: "hk"
        url: "https://bestcf.tools12345.com/tiancheng/hk.txt"
      - name: "tiancheng_jp"
        type: "text"
        country: "jp"
        url: "https://bestcf.tools12345.com/tiancheng/jp.txt"
      - name: "tiancheng_sg"
        type: "text"
        country: "sg"
        url: "https://bestcf.tools12345.com/tiancheng/sg.txt"
      - name: "tiancheng_kr"
        type: "text"
        country: "kr"
        url: "https://bestcf.tools12345.com/tiancheng/kr.txt"
      - name: "tiancheng_us"
        type: "text"
        country: "us"
        url: "https://bestcf.tools12345.com/tiancheng/us.txt"
      - name: "github_badafans"
        type: "json"
        url: "https://raw.githubusercontent.com/badafans/better-cloudflare-ip/master/shell/cf.json"

  # 策略 D: 本地精選種子庫補充
  local_seeds:
    enabled: true
    sample_per_cidr: 5                    # 每個 CIDR 抽樣個數
    files:
      ct: "data/seeds_ct.txt"
      cu: "data/seeds_cu.txt"
      cm: "data/seeds_cm.txt"
    country_files:
      hk: "data/countries/hk.txt"
      tw: "data/countries/tw.txt"
      jp: "data/countries/jp.txt"
      sg: "data/countries/sg.txt"
      kr: "data/countries/kr.txt"
      us: "data/countries/us.txt"
      eu: "data/countries/eu.txt"

# 階段二：同 /24 網段冷門鄰居平移演算法
neighbor_shifter:
  enabled: true
  samples_per_ip: 3                       # 每個公開熱門 IP 在同 /24 網段抽取的非公開冷門鄰居數
  bonus_score_ms: 15.0                    # 通過驗證的冷門鄰居獲得的延遲獎勵扣分 (-15ms)

# 輸出控制與容災保護
exporter:
  output_dir: "output"
  top_n: 50                               # 每個分類挑選前 50 名
  max_per_subnet: 3                       # 跨 /24 網段分散保護：同一個 C 段最多 3 個 IP
  anti_empty_protection: true             # 若當次無合格 IP，保留前次有效檔案避免空白覆寫
  history_file: "data/ip_history.json"    # 歷史加權分數持久化快照
