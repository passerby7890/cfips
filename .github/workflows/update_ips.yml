name: Update QuadNet & Country Optimized IPs

on:
  schedule:
    # 常規每 4 小時執行一次 (UTC 00:00, 04:00, 08:00, 12:00, 16:00, 20:00)
    - cron: '0 */4 * * *'
    # 北京時間晚高峰密集執行 (UTC+8: 19:30, 21:00, 22:30 -> UTC: 11:30, 13:00, 14:30)
    - cron: '30 11,14 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config/**'
      - 'data/**'
      - 'main.py'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  run-feed-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 檢出專案代碼 (Checkout repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 設定 Python 環境 (Setup Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝相依套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行回源驗證與優選產出 (Run Feed Generator)
        run: |
          python main.py

      - name: 自動提交並推送變更至 GitHub (Commit and Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 檢查 output 目錄是否有變更
          if [[ -n "$(git status --porcelain output/)" ]]; then
            echo "[+] 檢測到 output 目錄更新，準備提交變更..."
            git add output/
            git commit -m "chore: auto update quadnet & country optimized IPs [skip ci]"
            git push
            echo "[✔] 成功推送最新優選 IP 清單至 GitHub！"
          else
            echo "[*] output 目錄無變更，略過提交。"
          fi
