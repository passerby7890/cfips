name: Auto Update TriNet IPs (CT, CU, CM)

on:
  schedule:
    # 每 30 分鐘執行一次 (UTC 時間的第 0 與第 30 分鐘)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊按鈕立即執行
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'main.py'
      - 'config/**'
      - 'data/**'

permissions:
  contents: write

jobs:
  run-optimizer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run IP Optimizer & Red-Team Audit
        run: |
          python main.py
          python scripts/self_test_audit.py

      - name: Commit and Push Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 檢查空檔案防呆
          for f in output/ct.txt output/cu.txt output/cm.txt; do
            if [ ! -s "$f" ]; then
              echo "❌ 偵測到 $f 為空檔案，中止發布以保護現有清單！"
              exit 1
            fi
          done

          # 檢查 output 與歷史檔案是否有變更
          git add -A output/ data/ip_history.json
          if git status --porcelain | grep -qE '(output/|data/ip_history.json)'; then
            git commit -m "chore: auto update optimized IPs [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ 三網優選清單已成功更新並 Push 至 main 分支！"
          else
            echo "ℹ️ IP 清單無變動，略過 Commit。"
          fi
