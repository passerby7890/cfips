name: Auto Update TriNet & Country IPs

on:
  schedule:
    # 每 30 分鐘執行一次 (UTC 時間的第 0 與第 30 分鐘)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊按鈕立即執行測試
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'main.py'
      - 'config/**'

# 關鍵權限：允許 Action 將生成的 output/* 提交並 Push 回倉庫
permissions:
  contents: write

jobs:
  run-optimizer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 取出完整歷史以避免 push 衝突
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run IP Optimizer & Verification
        run: |
          # 執行測活、回源 101 驗證並產出 output/ 目錄檔案
          python main.py

      - name: Commit and Push Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 確保最新程式碼，避免衝突
          git pull --rebase origin main

          # 檢查 output 目錄是否有變更
          if [ -d "output" ]; then
            git add output/
            # 只有當 output 有檔案異動時才 commit
            if git status --porcelain | grep -q 'output/'; then
              git commit -m "chore: auto update optimized IPs [skip ci]"
              git push origin main
              echo "✅ IP 庫更新成功並已 Push 至倉庫！"
            else
              echo "ℹ️ IP 清單無變動，略過 Commit。"
            fi
          else
            echo "⚠️ 未檢測到 output 目錄，請檢查 main.py 執行狀態！"
            exit 1
          fi
